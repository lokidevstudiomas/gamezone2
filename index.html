<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>GameZone Store</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
}

header{
background:#020617;
padding:15px 30px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:26px;
font-weight:bold;
color:#38bdf8;
}

.hero{
text-align:center;
padding:50px;
background:linear-gradient(135deg,#1e293b,#020617);
}

.store{
padding:40px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
gap:20px;
}

.game{
background:#1e293b;
border-radius:10px;
overflow:hidden;
}

.game img{
width:100%;
height:150px;
object-fit:cover;
}

.info{
padding:12px;
}

button{
padding:8px;
border:none;
background:#22c55e;
border-radius:6px;
cursor:pointer;
margin-top:6px;
}

.panel{
background:#1e293b;
margin:40px auto;
padding:20px;
width:320px;
border-radius:10px;
text-align:center;
}

.panel input,
.panel textarea{
width:90%;
padding:8px;
margin:5px;
border-radius:6px;
border:none;
}

footer{
text-align:center;
padding:20px;
background:#020617;
}

</style>
</head>

<body>

<header>
<div class="logo">🎮 GameZone</div>
</header>

<section class="hero">
<h1>Tienda de Juegos</h1>
<p>Publica juegos, archivos y presentaciones</p>
</section>

<section class="store" id="store">
</section>

<section class="panel">

<h2>Subir juego o archivo</h2>

<input id="titulo" placeholder="Nombre">

<textarea id="descripcion" placeholder="Descripción"></textarea>

<p>Imagen del juego</p>
<input type="file" id="imagen" accept="image/*">

<p>Archivo del juego</p>
<input type="file" id="archivo">

<p>Archivo extra (PDF / PowerPoint / ZIP)</p>
<input type="file" id="archivoExtra">

<br><br>

<button onclick="publicar()">Publicar</button>

</section>

<footer>
GameZone 2026
</footer>

<script>

function publicar(){

let titulo=document.getElementById("titulo").value
let descripcion=document.getElementById("descripcion").value

let imagen=document.getElementById("imagen").files[0]
let archivo=document.getElementById("archivo").files[0]
let archivoExtra=document.getElementById("archivoExtra").files[0]

let imgURL=""
let archivoURL=""
let archivoExtraURL=""

if(imagen){
imgURL=URL.createObjectURL(imagen)
}

if(archivo){
archivoURL=URL.createObjectURL(archivo)
}

if(archivoExtra){
archivoExtraURL=URL.createObjectURL(archivoExtra)
}

let game=document.createElement("div")
game.className="game"

game.innerHTML=`

<img src="${imgURL}">

<div class="info">

<h3>${titulo}</h3>

<p>${descripcion}</p>

<a href="${archivoURL}" download>
<button>Descargar juego</button>
</a>

<a href="${archivoExtraURL}" download>
<button>Descargar archivo</button>
</a>

</div>

`

document.getElementById("store").appendChild(game)

}

</script>

</body>
</html>
